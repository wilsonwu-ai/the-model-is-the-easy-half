<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every returned plate becomes a practice order &#183; The loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Evaluation &#183; Closing the loop</p>
    <h1>Every returned plate becomes a practice order</h1>

    <svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="order-book-loop-title order-book-loop-desc">
      <title id="order-book-loop-title">Every returned plate becomes a practice order</title>
      <desc id="order-book-loop-desc">Loop in which guests&#8217; tickets go through the kitchen of runner, sous-chef and cook, every step is written in the order book, a morning read of the book raises flags for missing content, broken indexing, citation failures and sent-back plates, those flags become labeled practice orders, and the practice orders return to the kitchen as the check that runs before every change.</desc>

      <defs>
        <marker id="order-book-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="order-book-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors first, so boxes sit on top -->
      <line x1="248" y1="164" x2="328" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#order-book-loop-arrow)"/>
      <line x1="480" y1="176" x2="508" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#order-book-loop-arrow)"/>
      <line x1="640" y1="176" x2="668" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#order-book-loop-arrow)"/>
      <line x1="820" y1="164" x2="900" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#order-book-loop-arrow)"/>
      <line x1="1058" y1="360" x2="1058" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#order-book-loop-arrow)"/>
      <line x1="836" y1="488" x2="704" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#order-book-loop-arrow)"/>
      <line x1="574" y1="440" x2="574" y2="232" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#order-book-loop-arrow-accent)"/>

      <!-- Connector labels, each with a visible gap from its line -->
      <rect x="832" y="136" width="56" height="18" rx="2" fill="#f5f5f5"/>
      <rect x="722" y="460" width="96" height="18" rx="2" fill="#f5f5f5"/>
      <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7a8399" letter-spacing="0.06em">
        <text x="860" y="150" text-anchor="middle">LOGGED</text>
        <text x="770" y="474" text-anchor="middle">LABEL THEM</text>
        <text x="1042" y="406" text-anchor="end">READ EVERY MORNING</text>
        <text x="590" y="320">THE CHECK THAT RUNS</text>
        <text x="590" y="340">BEFORE EVERY CHANGE</text>
      </g>

      <!-- Guests' tickets -->
      <rect x="72" y="128" width="176" height="72" rx="4" fill="#f5f5f5"/>
      <rect x="72" y="128" width="176" height="72" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <circle cx="72" cy="164" r="5" fill="#f5f5f5"/>
      <path d="M72 159 A5 5 0 0 1 72 169" fill="none" stroke="#7a8399" stroke-width="1"/>
      <circle cx="248" cy="164" r="5" fill="#f5f5f5"/>
      <path d="M248 159 A5 5 0 0 0 248 169" fill="none" stroke="#7a8399" stroke-width="1"/>
      <text x="160" y="160" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Guests&#8217; tickets</text>
      <text x="160" y="182" fill="#7a8399" font-size="13" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">USER QUERIES</text>

      <!-- Kitchen -->
      <rect x="328" y="96" width="492" height="136" rx="8" fill="#f5f5f5"/>
      <rect x="328" y="96" width="492" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="348" y="122" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">The kitchen</text>
      <text x="800" y="122" fill="#7a8399" font-size="13" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.06em">RAG PIPELINE</text>

      <rect x="348" y="140" width="132" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="348" y="140" width="132" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="414" y="172" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Runner</text>
      <text x="414" y="194" fill="#7a8399" font-size="13" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">RETRIEVER</text>

      <rect x="508" y="140" width="132" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="508" y="140" width="132" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="574" y="172" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Sous-chef</text>
      <text x="574" y="194" fill="#7a8399" font-size="13" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">RERANKER</text>

      <rect x="668" y="140" width="132" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="668" y="140" width="132" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="734" y="172" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Cook</text>
      <text x="734" y="194" fill="#7a8399" font-size="13" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">GENERATOR</text>

      <!-- Order book -->
      <rect x="900" y="96" width="316" height="264" rx="6" fill="#f5f5f5"/>
      <rect x="900" y="96" width="316" height="264" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="924" y="128" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">The order book</text>
      <text x="924" y="150" fill="#7a8399" font-size="13" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">TRACE OF EVERY REQUEST</text>
      <g fill="#4f5d75">
        <circle cx="928" cy="181" r="2.5"/>
        <circle cx="928" cy="207" r="2.5"/>
        <circle cx="928" cy="233" r="2.5"/>
        <circle cx="928" cy="259" r="2.5"/>
        <circle cx="928" cy="285" r="2.5"/>
        <circle cx="928" cy="311" r="2.5"/>
        <circle cx="928" cy="337" r="2.5"/>
      </g>
      <g font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2d3142">
        <text x="942" y="186">The ticket</text>
        <text x="942" y="212">The rewritten ticket</text>
        <text x="942" y="238">The cards and their scores</text>
        <text x="942" y="264">The sous-chef&#8217;s scores</text>
        <text x="942" y="290">The final prompt</text>
        <text x="942" y="316">The plate</text>
        <text x="942" y="342">Time spent at each station</text>
      </g>

      <!-- Morning read -->
      <rect x="836" y="440" width="380" height="312" rx="6" fill="#f5f5f5"/>
      <rect x="836" y="440" width="380" height="312" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="860" y="472" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">The morning read</text>
      <text x="860" y="494" fill="#7a8399" font-size="13" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">FLAGS RAISED BY THE BOOK</text>
      <line x1="860" y1="508" x2="1192" y2="508" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <line x1="860" y1="572" x2="1192" y2="572" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <line x1="860" y1="628" x2="1192" y2="628" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <line x1="860" y1="684" x2="1192" y2="684" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>

      <g stroke="#2d3142" stroke-width="1.2" stroke-linecap="round">
        <line x1="866" y1="524" x2="866" y2="556"/>
        <line x1="866" y1="580" x2="866" y2="612"/>
        <line x1="866" y1="636" x2="866" y2="668"/>
        <line x1="866" y1="692" x2="866" y2="724"/>
      </g>
      <g fill="#2d3142">
        <polygon points="866,524 884,530 866,538"/>
        <polygon points="866,580 884,586 866,594"/>
        <polygon points="866,636 884,642 866,650"/>
        <polygon points="866,692 884,698 866,706"/>
      </g>
      <g font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2d3142">
        <text x="900" y="538">Best card scored poorly</text>
        <text x="900" y="594">A run of &#8220;we don&#8217;t have that&#8221;</text>
        <text x="900" y="650">Plate cites a card never on the tray</text>
        <text x="900" y="706">Guest sent the plate back</text>
      </g>
      <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7a8399" letter-spacing="0.06em">
        <text x="900" y="558">CONTENT GAP</text>
        <text x="900" y="614">CHECK THE INDEXING JOB</text>
        <text x="900" y="670">CITATION FAILURE</text>
        <text x="900" y="726">THUMBS-DOWN</text>
      </g>

      <!-- Practice orders -->
      <rect x="444" y="440" width="260" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="444" y="440" width="260" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="574" y="478" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Practice orders</text>
      <text x="574" y="502" fill="#7a8399" font-size="13" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">LABELED TEST SET</text>

      <!-- Editorial note -->
      <text x="72" y="700" fill="#2d3142" font-size="20" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">A bad plate today is a practice order tomorrow.</text>
    </svg>
  </div>
</body>
</html>
