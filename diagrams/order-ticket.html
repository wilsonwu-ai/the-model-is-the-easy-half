<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three ways a message breaks on the way</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Serialization &middot; Data in motion</p>
    <h1>Three ways a message breaks on the way</h1>

    <svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="order-ticket-title order-ticket-desc">
      <title id="order-ticket-title">Three ways a message breaks on the way</title>
      <desc id="order-ticket-desc">A sequence in which one order travels from a web app through an orders service and a payments service into a ledger database, and is quietly damaged three times: a large identifier loses digits in transit, a money amount stored as a fraction drifts, and a confirmation is lost after the record has already been written, leaving the order stuck in processing with no error raised anywhere.</desc>
      <defs>
        <marker id="order-ticket-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="order-ticket-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="order-ticket-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ LIFELINES ============ -->
      <line x1="120" y1="104" x2="120" y2="656" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="320" y1="104" x2="320" y2="656" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="520" y1="104" x2="520" y2="656" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="720" y1="104" x2="720" y2="656" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ============ HOP GAPS: leader crosses a lifeline, lifeline breaks ============ -->
      <rect x="516" y="152" width="8" height="16" fill="#f5f5f5"/>
      <rect x="716" y="152" width="8" height="16" fill="#f5f5f5"/>
      <rect x="716" y="256" width="8" height="16" fill="#f5f5f5"/>
      <rect x="716" y="472" width="8" height="16" fill="#f5f5f5"/>

      <!-- ============ NOTE LEADERS (annotation, not flow) ============ -->
      <line x1="336" y1="160" x2="880" y2="160" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="2,3"/>
      <circle cx="336" cy="160" r="2" fill="#7a8399"/>
      <line x1="536" y1="264" x2="880" y2="264" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="2,3"/>
      <circle cx="536" cy="264" r="2" fill="#7a8399"/>
      <line x1="536" y1="480" x2="880" y2="480" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="2,3"/>
      <circle cx="536" cy="480" r="2" fill="#7a8399"/>

      <!-- ============ MESSAGES (drawn before boxes) ============ -->
      <!-- 1. Web app -> Orders service -->
      <line x1="124" y1="160" x2="316" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#order-ticket-arrow)"/>
      <!-- 2. Orders service -> Payments service -->
      <line x1="324" y1="264" x2="516" y2="264" stroke="#4f5d75" stroke-width="1" marker-end="url(#order-ticket-arrow)"/>
      <!-- 3. Payments service -> Ledger database -->
      <line x1="524" y1="344" x2="716" y2="344" stroke="#4f5d75" stroke-width="1" marker-end="url(#order-ticket-arrow)"/>
      <!-- 4. Ledger database -> Payments service (return, dashed + filled head) -->
      <line x1="716" y1="400" x2="524" y2="400" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#order-ticket-arrow)"/>
      <!-- 5. Payments service -> Orders service: TIMEOUT (focal) -->
      <line x1="516" y1="480" x2="324" y2="480" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#order-ticket-arrow-accent)"/>
      <!-- 6. Orders service self-message -->
      <path d="M 324 544 H 348 A 8 8 0 0 1 356 552 V 576 A 8 8 0 0 1 348 584 H 328" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#order-ticket-arrow)"/>

      <!-- ============ MESSAGE LABELS (masked, 8px clear of the stroke) ============ -->
      <rect x="172" y="116" width="96" height="36" rx="2" fill="#f5f5f5"/>
      <text x="220" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Place an order</text>
      <text x="220" y="148" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">JSON BODY</text>

      <rect x="368" y="220" width="104" height="36" rx="2" fill="#f5f5f5"/>
      <text x="420" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Charge the card</text>
      <text x="420" y="252" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">JSON BODY</text>

      <rect x="572" y="312" width="96" height="24" rx="2" fill="#f5f5f5"/>
      <text x="620" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Write the record</text>

      <rect x="600" y="368" width="40" height="24" rx="2" fill="#f5f5f5"/>
      <text x="620" y="384" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">ok</text>

      <rect x="372" y="436" width="96" height="36" rx="2" fill="#f5f5f5"/>
      <text x="420" y="452" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">No reply arrives</text>
      <text x="420" y="468" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TIMEOUT</text>

      <rect x="368" y="540" width="128" height="36" rx="2" fill="#f5f5f5"/>
      <text x="376" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">still says: processing</text>
      <text x="376" y="572" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">ORDER STATE</text>

      <!-- ============ ACTORS ============ -->
      <rect x="40" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="48" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Web app</text>
      <text x="120" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">browser</text>

      <rect x="240" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Orders service</text>
      <text x="320" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">orders-api</text>

      <rect x="440" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Payments service</text>
      <text x="520" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">payments-api</text>

      <rect x="640" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="48" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="720" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Ledger database</text>
      <text x="720" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">ledger.db</text>

      <!-- ============ FAILURE NOTES ============ -->
      <!-- A -->
      <rect x="880" y="116" width="360" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="116" width="360" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="896" y="128" width="64" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="928" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ENCODING</text>
      <text x="896" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">A big ID number arrives changed</text>
      <text x="896" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.04em">JSON has one number type;</text>
      <text x="896" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.04em">large integers lose their last digits</text>

      <!-- B -->
      <rect x="880" y="220" width="360" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="220" width="360" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="896" y="232" width="64" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="928" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ENCODING</text>
      <text x="896" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Money stored as a fraction drifts</text>
      <text x="896" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.04em">0.1 + 0.2 is not 0.3 in binary</text>
      <text x="896" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.04em">floating point</text>

      <!-- C  (focal) -->
      <rect x="880" y="428" width="360" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="428" width="360" height="104" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="896" y="440" width="56" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="924" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">TIMING</text>
      <text x="896" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">The write happened.</text>
      <text x="896" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">The confirmation did not.</text>
      <text x="896" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.04em">half-updated state after a timeout</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="696" x2="1240" y2="696" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="160" y1="716" x2="196" y2="716" stroke="#4f5d75" stroke-width="1" marker-end="url(#order-ticket-arrow)"/>
      <text x="208" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">REQUEST</text>

      <line x1="380" y1="716" x2="416" y2="716" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#order-ticket-arrow)"/>
      <text x="428" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">REPLY</text>

      <line x1="600" y1="716" x2="636" y2="716" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#order-ticket-arrow-accent)"/>
      <text x="648" y="720" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">TIMEOUT</text>

      <line x1="840" y1="716" x2="864" y2="716" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="2,3"/>
      <circle cx="840" cy="716" r="2" fill="#7a8399"/>
      <rect x="864" y="712" width="12" height="8" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="888" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">SILENT CORRUPTION</text>
    </svg>
  </div>
</body>
</html>
