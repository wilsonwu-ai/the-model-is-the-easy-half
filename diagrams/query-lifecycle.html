<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What happens in that one second</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process &middot; The read path</p>
    <h1>What happens in that one second</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="query-lifecycle-title query-lifecycle-desc">
      <title id="query-lifecycle-title">What happens in that one second</title>
      <desc id="query-lifecycle-desc">A six-stage read path in which a question is turned into numbers, matched against stored passages, re-checked, pasted into a prompt and answered, then verified against the passages it cites; a failed verification sends the request back to the search stage to widen and retry, and each stage carries the failure it is most likely to hide.</desc>
      <defs>
        <marker id="query-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="query-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="query-lifecycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ CONNECTORS (drawn before nodes) ============ -->
      <!-- forward path -->
      <line x1="200"  y1="272" x2="248"  y2="272" stroke="#4f5d75" stroke-width="1" marker-end="url(#query-lifecycle-arrow)"/>
      <line x1="408"  y1="272" x2="456"  y2="272" stroke="#4f5d75" stroke-width="1" marker-end="url(#query-lifecycle-arrow)"/>
      <line x1="616"  y1="272" x2="664"  y2="272" stroke="#4f5d75" stroke-width="1" marker-end="url(#query-lifecycle-arrow)"/>
      <line x1="824"  y1="272" x2="872"  y2="272" stroke="#4f5d75" stroke-width="1" marker-end="url(#query-lifecycle-arrow)"/>
      <!-- focal-in: the edge that enters stage 06 -->
      <line x1="1032" y1="272" x2="1080" y2="272" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#query-lifecycle-arrow-accent)"/>

      <!-- retry path: 06 back to 02, routed below the row -->
      <path d="M 1232 336 V 432 Q 1232 440 1224 440 H 408 Q 400 440 400 432 V 336"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#query-lifecycle-arrow)"/>
      <rect x="772" y="420" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="816" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WIDEN AND RETRY</text>

      <!-- ============ NODES ============ -->

      <!-- 01 -->
      <rect x="40" y="208" width="160" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="208" width="160" height="128" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="52" y="220" width="24" height="16" rx="4" fill="rgba(45,49,66,0.12)"/>
      <text x="64" y="232" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="120" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Turn the question</text>
      <text x="120" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">into numbers</text>
      <text x="120" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">embed query</text>

      <!-- 02 -->
      <rect x="248" y="208" width="160" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="208" width="160" height="128" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="260" y="220" width="24" height="16" rx="4" fill="rgba(45,49,66,0.12)"/>
      <text x="272" y="232" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="328" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Grab the nearest</text>
      <text x="328" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">passages</text>
      <text x="328" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ANN search, top-k</text>

      <!-- 03 -->
      <rect x="456" y="208" width="160" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="208" width="160" height="128" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="468" y="220" width="24" height="16" rx="4" fill="rgba(45,49,66,0.12)"/>
      <text x="480" y="232" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="536" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Re-check the</text>
      <text x="536" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">shortlist properly</text>
      <text x="536" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">rerank, cross-encoder</text>

      <!-- 04 -->
      <rect x="664" y="208" width="160" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="208" width="160" height="128" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="676" y="220" width="24" height="16" rx="4" fill="rgba(45,49,66,0.12)"/>
      <text x="688" y="232" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="744" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Paste them into</text>
      <text x="744" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">the prompt</text>
      <text x="744" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">augment</text>

      <!-- 05 -->
      <rect x="872" y="208" width="160" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="872" y="208" width="160" height="128" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="884" y="220" width="24" height="16" rx="4" fill="rgba(45,49,66,0.12)"/>
      <text x="896" y="232" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
      <text x="952" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Write the answer</text>
      <text x="952" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">generate</text>

      <!-- 06 · FOCAL -->
      <rect x="1080" y="208" width="160" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="1080" y="208" width="160" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="1092" y="220" width="24" height="16" rx="4" fill="rgba(235,108,54,0.20)"/>
      <text x="1104" y="232" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">06</text>
      <text x="1160" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Check the answer</text>
      <text x="1160" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">is made of them</text>
      <text x="1160" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">verify + cite</text>

      <!-- ============ FAILURE NOTES ============ -->
      <rect x="40"   y="356" width="4" height="4" fill="#7a8399"/>
      <text x="52"   y="364" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">wrong model, silent drift</text>
      <rect x="248"  y="356" width="4" height="4" fill="#7a8399"/>
      <text x="260"  y="364" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">close words, wrong meaning</text>
      <rect x="456"  y="356" width="4" height="4" fill="#7a8399"/>
      <text x="468"  y="364" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">slow, skipped under load</text>
      <rect x="664"  y="356" width="4" height="4" fill="#7a8399"/>
      <text x="676"  y="364" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">context window overflows</text>
      <rect x="872"  y="356" width="4" height="4" fill="#7a8399"/>
      <text x="884"  y="364" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fluent and confident</text>
      <rect x="1080" y="356" width="4" height="4" fill="#7a8399"/>
      <text x="1092" y="364" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">the only real check</text>

      <!-- ============ EDITORIAL CALLOUT ============ -->
      <path d="M 1176 144 Q 1176 176 1160 204" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="1160" cy="204" r="2" fill="#2d3142"/>
      <text x="1240" y="108" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="end">Most diagrams of this stop at five.</text>
      <text x="1240" y="132" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="end">Step six is the one that decides whether you can ship it.</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="596" x2="1240" y2="596" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="140" y1="620" x2="172" y2="620" stroke="#4f5d75" stroke-width="1" marker-end="url(#query-lifecycle-arrow)"/>
      <text x="184" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.08em">FORWARD PATH</text>

      <line x1="340" y1="620" x2="372" y2="620" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#query-lifecycle-arrow)"/>
      <text x="384" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.08em">RETRY PATH</text>

      <rect x="620" y="616" width="4" height="4" fill="#7a8399"/>
      <text x="632" y="624" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.08em">FAILURE NOTE</text>
    </svg>
  </div>
</body>
</html>
