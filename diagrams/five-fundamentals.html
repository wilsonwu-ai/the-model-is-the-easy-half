<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five things underneath the model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:     'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Foundations · What breaks without each</p>
    <h1>Five things underneath the model</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="five-fundamentals-title five-fundamentals-desc">
      <title id="five-fundamentals-title">Five things underneath the model</title>
      <desc id="five-fundamentals-desc">A five-layer stack of the engineering skills that sit beneath an AI model, from building the application at the top down to managing the data at the base, where each layer names the concrete failure that happens when that skill is missing and the data layer is marked as the foundation everything else rests on.</desc>
      <defs>
        <marker id="five-fundamentals-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="five-fundamentals-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="five-fundamentals-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Direction column (left margin, outside the stack) -->
      <text x="64" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.18em">SURFACE</text>
      <line x1="64" y1="72" x2="64" y2="432" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <polygon points="60,432 68,432 64,440" fill="#4f5d75"/>
      <text x="64" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.18em">FOUNDATION</text>

      <!-- Stack silhouette for the four supporting layers -->
      <rect x="120" y="72" width="720" height="288" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>

      <!-- L5 · Building the whole application -->
      <text x="140" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">L5</text>
      <text x="200" y="104" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Building the whole application</text>
      <text x="200" y="124" fill="#4f5d75" font-size="12" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">the AI works; nobody can use it</text>
      <text x="820" y="112" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.14em">SOFTWARE ENGINEERING</text>
      <line x1="120" y1="144" x2="840" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- L4 · Operating it in the real world -->
      <text x="140" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">L4</text>
      <text x="200" y="176" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Operating it in the real world</text>
      <text x="200" y="196" fill="#4f5d75" font-size="12" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">fine at ten users, falls over at ten thousand</text>
      <text x="820" y="184" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.14em">OPERATIONS · SRE</text>
      <line x1="120" y1="216" x2="840" y2="216" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- L3 · Designing how the pieces fit -->
      <text x="140" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">L3</text>
      <text x="200" y="248" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Designing how the pieces fit</text>
      <text x="200" y="268" fill="#4f5d75" font-size="12" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">a prototype's shape, carried into production</text>
      <text x="820" y="256" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.14em">SYSTEM DESIGN</text>
      <line x1="120" y1="288" x2="840" y2="288" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- L2 · Making it safe and reliable -->
      <text x="140" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">L2</text>
      <text x="200" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Making it safe and reliable</text>
      <text x="200" y="340" fill="#4f5d75" font-size="12" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">one rate limit, and the whole page dies</text>
      <text x="820" y="328" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.14em">SAFETY · RELIABILITY</text>

      <!-- L1 · Managing the data (FOCAL) -->
      <rect x="120" y="360" width="720" height="72" fill="#ffffff"/>
      <rect x="120" y="360" width="720" height="72" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="400" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">L1</text>
      <text x="200" y="392" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Managing the data</text>
      <text x="200" y="412" fill="#4f5d75" font-size="12" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">the model cannot know what you never stored</text>
      <text x="820" y="400" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.14em">DATA ENGINEERING</text>

      <!-- Editorial callout · points at the bottom layer -->
      <circle cx="176" cy="432" r="2" fill="#2d3142"/>
      <path d="M 192 484 Q 172 464 176 436" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="200" y="496" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">If the data architecture is wrong, the AI does not know what it does not know.</text>

      <!-- Legend · horizontal strip, below a hairline rule -->
      <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="548" width="12" height="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="144" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">SUPPORTING LAYER</text>
      <rect x="288" y="548" width="12" height="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="312" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">FOUNDATION · HARDEST TO CHANGE LATER</text>
    </svg>
  </div>
</body>
</html>
