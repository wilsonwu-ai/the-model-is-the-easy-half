<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The whole kitchen &#183; The map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">The map &#183; Eight stations, left to right</p>
    <h1>The whole kitchen</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="the-whole-kitchen-title the-whole-kitchen-desc">
      <title id="the-whole-kitchen-title">The whole kitchen</title>
      <desc id="the-whole-kitchen-desc">Kitchen map in eight stations, left to right: a delivery of boxes (parsing), pantry shelves (chunking and indexing), a runner with a tray (retrieval), a sous-chef checking the tray against a ticket (reranking), a written ticket (serialization), a cook at the stove (language model), a taster with a spoon (verification) and the pass where plates leave (permissions).</desc>

      <!-- Headings -->

      <text x="72" y="124" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">KITCHEN WORD ABOVE &#183; SYSTEM WORD BELOW</text>

      <!-- Connectors first, so cards sit on top -->

        <line x1="336" y1="240" x2="368" y2="240" marker-end="url(#the-whole-kitchen-arrow)"/>

        <line x1="768" y1="240" x2="800" y2="240" marker-end="url(#the-whole-kitchen-arrow)"/>
        <line x1="912" y1="240" x2="944" y2="240" marker-end="url(#the-whole-kitchen-arrow)"/>
        <line x1="1056" y1="240" x2="1088" y2="240" marker-end="url(#the-whole-kitchen-arrow)"/>
      </g>
