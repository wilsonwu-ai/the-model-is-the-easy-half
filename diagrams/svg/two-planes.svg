<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="two-planes-title two-planes-desc">
      <title id="two-planes-title">Two kitchens, one shelf</title>
      <desc id="two-planes-desc">A retrieval pipeline in which a shared vector index is the single component touched by both halves: a scheduled offline path that cuts documents into passages and turns each into numbers writes into the index, and a per-request online path that turns the question into numbers, searches the index for the nearest passages, and answers with sources reads from it.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="two-planes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="two-planes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="two-planes-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <!-- ============ background ============ -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ zones (drawn before arrows and nodes) ============ -->
      <rect x="48" y="56" width="640" height="160" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="64" y="60" width="360" height="12" rx="2" fill="#f5f5f5"/>
      <text x="72" y="68" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">BEFORE ANYONE ASKS · RUNS ON A SCHEDULE, MINUTES TO HOURS</text>

      <rect x="48" y="432" width="1184" height="160" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="64" y="436" width="304" height="12" rx="2" fill="#f5f5f5"/>
      <text x="72" y="444" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">WHEN SOMEONE ASKS · RUNS ONCE, IN ABOUT A SECOND</text>

      <!-- ============ connectors (drawn before nodes) ============ -->
      <!-- offline row -->
      <line x1="240" y1="140" x2="288" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#two-planes-arrow)"/>
      <line x1="448" y1="140" x2="496" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#two-planes-arrow)"/>
      <!-- offline writes DOWN into the shelf -->
      <line x1="576" y1="184" x2="576" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#two-planes-arrow)"/>
      <rect x="584" y="220" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="228" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

      <!-- shelf reads ACROSS into the search step -->
      <path d="M 672,324 H 792 Q 800,324 800,332 V 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#two-planes-arrow)"/>
      <rect x="712" y="304" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="732" y="312" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

      <!-- online row -->
      <line x1="240" y1="516" x2="400" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#two-planes-arrow)"/>
      <line x1="560" y1="516" x2="720" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#two-planes-arrow)"/>
      <line x1="880" y1="516" x2="1040" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#two-planes-arrow)"/>

      <!-- ============ offline nodes ============ -->
      <rect x="80" y="96" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="96" width="160" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="160" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Your documents</text>
      <text x="160" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pdf, wiki, db rows</text>

      <rect x="288" y="96" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="96" width="160" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="368" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Cut into passages</text>
      <text x="368" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">chunk + overlap</text>

      <rect x="496" y="96" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="96" width="160" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="576" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Turn each into</text>
      <text x="576" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">numbers</text>
      <text x="576" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">embed</text>

      <!-- ============ the shared shelf (focal) ============ -->
      <rect x="480" y="276" width="192" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="276" width="192" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="576" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">The shelf</text>
      <text x="576" y="352" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">vector index</text>

      <!-- ============ online nodes ============ -->
      <rect x="80" y="472" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="472" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">The question</text>
      <text x="160" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">user query</text>

      <rect x="400" y="472" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="472" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Turn it into</text>
      <text x="480" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">numbers</text>
      <text x="480" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">embed</text>

      <rect x="720" y="472" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="472" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Find the nearest</text>
      <text x="800" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">passages</text>
      <text x="800" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ANN search, top-k</text>

      <rect x="1040" y="472" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1040" y="472" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1120" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Answer, with</text>
      <text x="1120" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">sources</text>
      <text x="1120" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">generate + cite</text>

      <!-- ============ editorial callout ============ -->
      <text x="64" y="264" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Both sides must use the same model.</text>
      <text x="64" y="284" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Change one and not the other, and every</text>
      <text x="64" y="304" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">answer quietly gets worse, with no error</text>
      <text x="64" y="324" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">anywhere.</text>
      <path d="M 344,252 Q 440,216 528,184" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="528" cy="184" r="2" fill="#2d3142"/>
      <path d="M 360,336 Q 400,408 440,472" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="440" cy="472" r="2" fill="#2d3142"/>

      <!-- ============ legend ============ -->
      <line x1="48" y1="632" x2="1232" y2="632" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="48" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="160" y="644" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="184" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">OFFLINE / SCHEDULED</text>

      <rect x="440" y="644" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="464" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">ONLINE / PER-REQUEST</text>

      <rect x="760" y="644" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="784" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">SHARED STORE</text>
    </svg>