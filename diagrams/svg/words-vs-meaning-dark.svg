      <text x="72" y="560" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.10em">THE QUESTION AND THE ANSWER SHARE NO WORDS &#183; THE DECOY SHARES TWO</text>
