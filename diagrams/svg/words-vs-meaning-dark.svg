      <text x="704" y="124" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">VECTOR SEARCH &#183; EMBEDDINGS</text>

