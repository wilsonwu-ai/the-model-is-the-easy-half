      <text x="72" y="592" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">axes are illustrative; real embeddings have hundreds of dimensions, which cannot be drawn.</text>

