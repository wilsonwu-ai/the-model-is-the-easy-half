      <title id="words-vs-meaning-dark-title">Counting words, and measuring meaning</title>
      <desc id="words-vs-meaning-dark-desc">Two side-by-side scatter panels comparing keyword matching with meaning-based matching: in the first the question sits far from the correct answer and close to a decoy that happens to share its words, and in the second the same four items are repositioned so the question sits right beside the correct answer.</desc>

